name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: asymmetric-effort/actions/actions/setup-bun@main
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: asymmetric-effort/actions/actions/setup-bun@main
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make test

  build-lib:
    name: Build Library
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: asymmetric-effort/actions/actions/setup-bun@main
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make build
      - name: Verify build output is importable
        run: |
          node -e "const m = require('./build/index.js'); console.log('Exports:', Object.keys(m).length, 'symbols'); if (Object.keys(m).length < 10) { process.exit(1); }"

  dist-validation:
    name: Dist Validation Tests
    runs-on: ubuntu-latest
    needs: build-lib
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: asymmetric-effort/actions/actions/setup-bun@main
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make build
      - run: bun test tests/dist/

  e2e:
    name: End-to-End Library Tests
    runs-on: ubuntu-latest
    needs: build-lib
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: asymmetric-effort/actions/actions/setup-bun@main
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test tests/e2e

  # --- Site deploy + PDV (main push only) ---
  # Runs on every main push. Tag pushes skip this since the
  # corresponding main push already validated the site.

  build-site:
    name: Build Site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [e2e, dist-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: asymmetric-effort/actions/actions/setup-bun@main
        with:
          bun-version: latest
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Copy CNAME
        run: cp site/CNAME site/dist/CNAME
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-deployment:
    name: Post-Deployment Verification (Playwright)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install e2e dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Wait for deployment to propagate
        run: |
          echo "Waiting 60s for GitHub Pages deployment to propagate..."
          sleep 60

      - name: Run Playwright site verification tests
        working-directory: e2e
        run: bunx playwright test
        env:
          SITE_URL: https://nogginlessdom.asymmetric-effort.com

  # --- npm publish (on version tags, after all validation) ---
  # PDV already ran on the main push before tagging.
  # Tag push validates: lint, test, build, dist, e2e — then publishes.

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [e2e, dist-validation]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: asymmetric-effort/actions/actions/checkout@main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Configure npm for OIDC
        run: |
          echo "//registry.npmjs.org/:_authToken=" > ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
      - run: bun install --frozen-lockfile
      - run: make build
      - name: Publish with provenance (OIDC)
        run: npx npm@latest publish --provenance --access public
