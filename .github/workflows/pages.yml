name: Deploy and Verify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make test

  build-lib:
    name: Build Library
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: make build

  build-site:
    name: Build Site
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile
      - name: Build site
        working-directory: site
        run: bun run build
      - name: Copy CNAME
        run: cp site/CNAME site/dist/CNAME
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build-site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify-deployment:
    name: Post-Deployment Verification (Playwright)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install e2e dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Wait for deployment to propagate
        run: |
          echo "Waiting 60s for GitHub Pages deployment to propagate..."
          sleep 60

      - name: Run Playwright site verification tests
        working-directory: e2e
        run: bunx playwright test
        env:
          SITE_URL: https://nogginlessdom.asymmetric-effort.com

  e2e-validation:
    name: End-to-End Library Validation
    needs: verify-deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run NogginLessDom e2e tests
        run: bun test tests/e2e

      - name: Verify build output is importable
        run: |
          make build
          node -e "const m = require('./build/index.js'); console.log('Exports:', Object.keys(m).length, 'symbols'); if (Object.keys(m).length < 10) { process.exit(1); }"
          echo "Library build verified successfully"
