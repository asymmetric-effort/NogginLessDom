<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="NogginLessDom — A zero-dependency testing framework built on node:test and node:assert."
    />
    <title>NogginLessDom</title>
    <link rel="icon" type="image/png" href="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg-primary: #0d0d1a;
        --bg-secondary: #1a1a2e;
        --bg-tertiary: #12121f;
        --text-primary: #ffffff;
        --text-secondary: #e0e0e0;
        --text-muted: #aaa;
        --text-dimmed: #666;
        --accent: #00d4aa;
        --border: #2a2a3e;
      }
      body {
        margin: 0;
        background-color: #0d0d1a;
        color: #e0e0e0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg-primary: #ffffff;
          --bg-secondary: #f5f5f7;
          --bg-tertiary: #eeeef0;
          --text-primary: #1a1a2e;
          --text-secondary: #333;
          --text-muted: #666;
          --text-dimmed: #999;
          --accent: #008866;
          --border: #ddd;
        }
        body {
          background-color: #ffffff;
          color: #1a1a2e;
        }
      }
    </style>
  </body>
</html>
